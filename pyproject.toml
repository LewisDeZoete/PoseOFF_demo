[project]
name = "poseoff-demo"
version = "0.1.0"
description = "PoseOFF demonstration, using either LK or normal flow as motion embeddings sampled around pose keypoints extracted with Ultralytics YOLO-pose"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "ultralytics>=8.4.115",
]
